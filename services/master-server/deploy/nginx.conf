server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name master.fetchers.org;

    client_max_body_size 16k;
    ssl_certificate /etc/letsencrypt/live/master.fetchers.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master.fetchers.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/master.fetchers.org.access.log openmw_master;
    error_log /var/log/nginx/master.fetchers.org.error.log info;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name master.fetchers.org;
    access_log /var/log/nginx/master.fetchers.org.access.log openmw_master;
    error_log /var/log/nginx/master.fetchers.org.error.log info;

    # This deliberately narrow plaintext endpoint lets a client report why it
    # could not establish HTTPS. It accepts bounded, non-secret metadata only;
    # every other HTTP request remains redirected to HTTPS.
    location = /v1/client-diagnostics/tls {
        limit_except POST { deny all; }
        limit_req zone=openmw_master_tls_diagnostics burst=3 nodelay;
        client_max_body_size 4k;
        client_body_timeout 5s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
