# Install in /etc/nginx/conf.d so these directives load inside the global
# http context before the master.fetchers.org site configuration.
limit_req_zone $binary_remote_addr zone=openmw_master_tls_diagnostics:1m rate=6r/m;

log_format openmw_master escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"host":"$host","server_name":"$server_name",'
    '"tls_protocol":"$ssl_protocol","tls_cipher":"$ssl_cipher",'
    '"tls_session_reused":"$ssl_session_reused","sni":"$ssl_server_name",'
    '"user_agent":"$http_user_agent"}';
