[project]
name = "openmw-multiplayer-master-server"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "geoip2>=4.8,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: starts a local master service and simulated dedicated server",
]
