name: Fetcher Simulator Experimental prerelease
run-name: Fetcher Simulator Experimental prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetcher-simulator-vehicles-release
  cancel-in-progress: false

jobs:
  Windows:
    if: ${{ github.ref == 'refs/heads/experimental/public-test' }}
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: RelWithDebInfo
      package: true
      release: true
      release-tag: Fetcher-Simulator-Experimental
      release-name: Fetcher Simulator Experimental
      release-zip-name: fetcher-simulator.zip
      release-include-installer: false
      embed-fetcher-tester-tools: true
    secrets: inherit
