name: OpenBSD experimental

on:
  push:
    branches:
      - ci/openbsd

permissions:
  contents: read

concurrency:
  group: openbsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bcrypt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Test native OpenBSD bcrypt backend
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: "7.9"
          arch: x86_64
          usesh: true
          copyback: false
          run: |
            set -eux
            c++ -std=c++20 -Iextern/bcrypt \
              CI/openbsd-bcrypt-smoke.cpp \
              -o /tmp/openbsd-bcrypt-smoke
            /tmp/openbsd-bcrypt-smoke

  build:
    needs: bcrypt-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build multiplayer client and server on OpenBSD 7.9
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: "7.9"
          arch: x86_64
          usesh: true
          copyback: true
          cache-after-prepare: true
          prepare: |
            pkg_add \
              boost \
              bullet \
              cmake \
              ffmpeg \
              git \
              icu4c \
              lz4 \
              luajit \
              mygui \
              ninja \
              openal \
              openscenegraph \
              protobuf \
              sdl2 \
              sqlite3 \
              tinyxml \
              yaml-cpp
          run: |
            set -eux
            export PATH="/usr/local/bin:${PATH}"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git -C extern/GameNetworkingSockets apply \
              "$GITHUB_WORKSPACE/CI/patches/gamenetworkingsockets-openbsd.patch"

            cmake -S . -B build-openbsd -G Ninja \
              -D CMAKE_BUILD_TYPE=RelWithDebInfo \
              -D CMAKE_CXX_SCAN_FOR_MODULES=OFF \
              -D CMAKE_INSTALL_PREFIX=/usr/local \
              -D BUILD_MULTIPLAYER=ON \
              -D BUILD_DEDICATED_SERVER=ON \
              -D BUILD_SHARED_LIB=OFF \
              -D BUILD_STATIC_LIB=ON \
              -D BUILD_LAUNCHER=OFF \
              -D BUILD_WIZARD=OFF \
              -D BUILD_OPENCS=OFF \
              -D BUILD_MWINIIMPORTER=OFF \
              -D BUILD_ESSIMPORTER=OFF \
              -D BUILD_BSATOOL=OFF \
              -D BUILD_ESMTOOL=OFF \
              -D BUILD_NIFTEST=OFF \
              -D BUILD_NAVMESHTOOL=OFF \
              -D BUILD_BULLETOBJECTTOOL=OFF \
              -D BUILD_COMPONENTS_TESTS=OFF \
              -D BUILD_OPENMW_TESTS=OFF \
              -D BUILD_OPENCS_TESTS=OFF

            cmake --build build-openbsd --target openmw openmw-server --parallel 2

            revision="$(git rev-parse --short=10 HEAD)"
            package_name="fetcher-simulator-openbsd-7.9-amd64-${revision}"
            artifact_dir="$GITHUB_WORKSPACE/artifacts"
            stage_dir="$artifact_dir/$package_name"

            rm -rf "$artifact_dir"
            mkdir -p "$stage_dir"
            DESTDIR="$stage_dir" cmake --install build-openbsd

            "$stage_dir/usr/local/bin/openmw" --version
            "$stage_dir/usr/local/bin/openmw-server" --help >/dev/null

            {
              echo "Fetcher Simulator / OpenMW OpenBSD artifact"
              echo "Revision: $(git rev-parse HEAD)"
              echo "Target: OpenBSD 7.9 amd64"
              echo "Build type: RelWithDebInfo"
              echo
              echo "Runtime packages:"
              echo "  pkg_add boost bullet ffmpeg icu4c lz4 luajit mygui openal openscenegraph protobuf sdl2 sqlite3 tinyxml yaml-cpp"
            } > "$stage_dir/BUILD-INFO.txt"

            ldd "$stage_dir/usr/local/bin/openmw" > "$stage_dir/openmw-ldd.txt"
            ldd "$stage_dir/usr/local/bin/openmw-server" > "$stage_dir/openmw-server-ldd.txt"

            tar -C "$artifact_dir" -czf "$artifact_dir/$package_name.tar.gz" "$package_name"
            sha256 "$artifact_dir/$package_name.tar.gz" > "$artifact_dir/$package_name.tar.gz.sha256"

            rm -rf "$stage_dir" build-openbsd

      - name: Upload OpenBSD build artifact
        uses: actions/upload-artifact@v6
        with:
          name: fetcher-simulator-openbsd-7.9-amd64-${{ github.sha }}
          path: |
            artifacts/fetcher-simulator-openbsd-7.9-amd64-*.tar.gz
            artifacts/fetcher-simulator-openbsd-7.9-amd64-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
